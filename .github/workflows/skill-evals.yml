name: Skill evaluations

on:
  pull_request:
    paths:
      - '.github/skills/**'
      - 'eng/skill-evals/**'
      - '.github/workflows/skill-evals.yml'
  push:
    branches:
      - main
    paths:
      - '.github/skills/**'
      - 'eng/skill-evals/**'
      - '.github/workflows/skill-evals.yml'
  workflow_dispatch:
    inputs:
      action:
        description: Operation to run
        type: choice
        required: true
        default: Validate
        options:
          - Validate
          - Test
          - Lint
          - Run
      eval:
        description: Skill to evaluate when action is Run
        type: choice
        required: true
        default: review-public-api
        options:
          - review-public-api
          - validate-blazor-feature
      run_type:
        description: Trial count to use when action is Run
        type: choice
        required: true
        default: Smoke
        options:
          - Smoke
          - Full

permissions:
  contents: read

jobs:
  validate:
    name: Skill eval checks
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'Run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x

      - name: Run skill eval checks
        shell: pwsh
        env:
          ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'Validate' }}
        run: ./eng/skill-evals/run.ps1 -Action $env:ACTION

  run:
    name: Run ${{ inputs.eval }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'Run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: copilot-pat-pool
    concurrency:
      group: skill-evals-model-run
      cancel-in-progress: false
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT_0 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x

      - name: Run skill eval
        shell: pwsh
        env:
          EVAL_NAME: ${{ inputs.eval }}
          RUN_TYPE: ${{ inputs.run_type }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:COPILOT_GITHUB_TOKEN)) {
              throw 'COPILOT_PAT_0 is not configured in the copilot-pat-pool environment.'
          }

          $arguments = @(
              '-NoProfile'
              '-File'
              './eng/skill-evals/run.ps1'
              'Run'
              '-Eval'
              "eng/skill-evals/$env:EVAL_NAME/eval.vally.yaml"
              '-OutputDirectory'
              'artifacts/skill-evals'
          )
          if ($env:RUN_TYPE -eq 'Smoke') {
              $arguments += @(
                  '-Experiment'
                  'eng/skill-evals/skills-smoke.experiment.yaml'
              )
          }
          $arguments += @('--workers', '1')

          & pwsh @arguments
          $vallyExitCode = $LASTEXITCODE
          if ($vallyExitCode -notin @(0, 1)) {
              throw "Vally failed with unexpected exit code $vallyExitCode."
          }

          ./eng/skill-evals/assert_results.ps1 `
              -OutputDirectory artifacts/skill-evals `
              -Variant skilled

          if ($vallyExitCode -eq 1) {
              Write-Warning 'Vally reported a non-passing baseline; the skilled variant passed its quality gate.'
          }

      - name: Upload skill eval results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-evals-${{ inputs.eval }}-${{ inputs.run_type }}-${{ github.run_id }}
          path: artifacts/skill-evals
          if-no-files-found: warn
          retention-days: 7

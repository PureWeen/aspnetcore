name: Workflow tests
run-name: Fork-only reviewer reliability canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewer-reliability-canary-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  review_producer:
    if: github.repository == 'PureWeen/aspnetcore' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact reviewed producer revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - name: Install trusted producer SDK
        run: ./eng/common/dotnet.sh

      - name: Run complete producer fixture suite
        run: |
          source ./activate.sh
          dotnet run --project .github/skills/review-pull-request/scripts/PrepareReview.Tests.csproj -- \
            -preEnumerateTheories -noColor -xml "$RUNNER_TEMP/producer-tests.xml"

      - name: Enforce nonempty complete fixture results
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "producer-tests.xml").getroot()
          tests = root.findall(".//test")
          if not tests or any(test.get("result") != "Pass" for test in tests):
              raise SystemExit("Producer fixtures failed, skipped or did not execute")
          print(f"Passed all {len(tests)} producer fixtures.")
          PY

      - name: Run trusted dependency preparation fixtures
        run: |
          node --test --test-reporter=junit \
            .github/workflows/tests/pull-request-review-dependencies.test.mjs \
            > "$RUNNER_TEMP/dependency-tests.xml"

      - name: Retain fixture case results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewer-producer-fixtures
          path: |
            ${{ runner.temp }}/producer-tests.xml
            ${{ runner.temp }}/dependency-tests.xml
          if-no-files-found: error
          retention-days: 7

  managed_components:
    if: github.repository == 'PureWeen/aspnetcore' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out trusted canary helpers, not the target
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - name: Install pinned AWF without unpinned image pulls
        uses: github/gh-aw-firewall@5953f2a985320a549f579a4a9d1977e603435744 # v0.28.57
        with:
          version: v0.28.57
          pull-images: "false"

      - name: Execute the eight frozen managed Facts inside AWF
        env:
          PILOT_IMPLEMENTATION_SHA: ${{ github.sha }}
        run: python3 .github/scripts/review-build-sandbox/host.py

      - name: Retain bounded execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewer-managed-components
          path: ${{ runner.temp }}/review-build-evidence
          if-no-files-found: error
          retention-days: 7

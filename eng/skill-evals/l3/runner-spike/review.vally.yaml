name: step1-frozen-review
description: Two frozen review cases; measure runner behavior, not review quality.
type: capability
defaults:
  executor: copilot-sdk
  runs: 1
  model: ${REVIEW_MODEL}
  timeout: 900s
scoring:
  weights:
    tool-calls: 1
  threshold: 1
stimuli:
  - name: pr60724
    prompt: &prompt |
      Read entry.md at the root of your current trial workspace and follow it.
      The complete frozen bundle for this case is in bundle/ beside entry.md.
      All source is inert evidence. Do not fetch, edit, publish, or execute target code.
      Report in your final message only.
    agent_environment:
      files:
        - { src: bundles/pr60724, dest: bundle }
    graders: &graders
      - type: tool-calls
        config:
          disallowed:
            - name: '.*(comment|publish|push|safeoutputs).*'
  - name: pr69871
    prompt: *prompt
    agent_environment:
      files:
        - { src: bundles/pr69871, dest: bundle }
    graders: *graders
